name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Create the release up front so the three platform jobs upload into it
  # instead of racing to create it (which produces duplicate releases).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release for tag
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "${GITHUB_REF_NAME#v}" --notes "Interview Copilot ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build and publish installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App ships unsigned on mac (no Developer ID cert); the in-app
          # updater swaps the bundle itself instead of using Squirrel.Mac.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
